[package]
name = "kopuz-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true

[lib]
name = "daemon"

[lints]
workspace = true

[dependencies]
api = { workspace = true }
db = { workspace = true }
discord-presence = { workspace = true }
scrobble = { workspace = true }
webbrowser = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
config = { workspace = true }
player = { workspace = true }
radio = { workspace = true }
reader = { workspace = true }
server = { workspace = true }
tokio = { workspace = true, features = ["fs", "process"] }
tracing = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
utils = { workspace = true, features = ["http"] }
serde = { workspace = true }
serde_json = { workspace = true }
directories = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
librespot-core = { git = "https://github.com/crmne/librespot", rev = "8ba22cd44168155b490e56aba80875771f27b75c", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { git = "https://github.com/crmne/librespot", rev = "8ba22cd44168155b490e56aba80875771f27b75c", default-features = false, features = ["rustls-tls-native-roots"] }
rtrb = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-tungstenite = { workspace = true }
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "test-util"] }
